<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octoopus Neon Coding Background</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071326}
#scene{position:relative;width:720px;height:1280px;overflow:hidden;background:
 radial-gradient(ellipse at 50% 12%,#12334a 0%,transparent 38%),
 radial-gradient(ellipse at 50% 62%,#0b2038 0%,transparent 58%),
 linear-gradient(155deg,#071326 0%,#091a30 52%,#050f20 100%);isolation:isolate}
#scene:before{content:"";position:absolute;inset:0;opacity:.22;background:repeating-linear-gradient(0deg,transparent 0 3px,#7cebe908 4px),radial-gradient(ellipse at center,transparent 35%,#020914 100%)}
.ambient{position:absolute;border-radius:50%;filter:blur(65px);pointer-events:none}
.ambient.a{width:460px;height:280px;top:20px;left:130px;background:#25e8df18;animation:ambient 6s ease-in-out infinite alternate}
.ambient.b{width:380px;height:380px;bottom:90px;left:160px;background:#087eaa12;animation:ambient 8s ease-in-out infinite alternate-reverse}
.grid{position:absolute;inset:0;opacity:.12;background-image:linear-gradient(#41faf1 1px,transparent 1px),linear-gradient(90deg,#41faf1 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(transparent 0%,black 12%,black 84%,transparent 100%)}
.code{position:absolute;color:#70e9e4;font:13px/1.9 Consolas,monospace;white-space:pre;opacity:.16;filter:blur(.15px);user-select:none}
.code.left{left:24px;top:340px;width:210px;transform:perspective(500px) rotateY(8deg)}
.code.right{right:18px;top:520px;width:190px;text-align:right;transform:perspective(500px) rotateY(-8deg);opacity:.12}
.code span{color:#41faf1}.code i{color:#7a9eb7;font-style:normal}.code b{color:#b4a2ff;font-weight:400}
.panel{position:absolute;border:1px solid #41faf11b;border-radius:10px;background:linear-gradient(145deg,#0c294022,#07172b18);box-shadow:inset 0 0 22px #41faf108,0 8px 28px #0002}
.panel.p1{top:390px;left:28px;width:205px;height:118px}.panel.p2{top:585px;right:24px;width:178px;height:140px}.panel.p3{bottom:145px;left:55px;width:140px;height:72px;opacity:.5}
.panel:before{content:"";position:absolute;left:12px;right:12px;top:14px;height:1px;background:#41faf12c;box-shadow:0 14px #41faf114,0 28px #41faf114,0 42px #41faf114,0 56px #41faf114}
.sign{position:absolute;top:76px;left:0;width:100%;height:220px;display:flex;align-items:center;justify-content:center}
.sign svg{width:650px;height:210px;overflow:visible}
.tube{font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-weight:700;letter-spacing:1px;font-size:94px;text-anchor:middle;fill:#cffffc;stroke:#41faf1;stroke-width:2.1;paint-order:stroke fill;filter:url(#neon);stroke-linejoin:round}
.tubeBase{font-family:"Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;font-weight:700;letter-spacing:1px;font-size:94px;text-anchor:middle;fill:none;stroke:#41faf1;stroke-width:8;opacity:.23;filter:url(#wideGlow)}
.spark{fill:none;stroke:#eaffff;stroke-width:2.8;stroke-linecap:round;stroke-dasharray:22 560;stroke-dashoffset:0;filter:url(#sparkGlow);opacity:0}
.signFrame{fill:none;stroke:#41faf12a;stroke-width:1.2}
.signFrameGlow{fill:none;stroke:#41faf10d;stroke-width:8;filter:url(#wideGlow)}
.scan{position:absolute;left:0;right:0;height:1px;top:0;background:linear-gradient(90deg,transparent,#41faf124,transparent);opacity:.45;animation:scan 7s linear infinite}
.dust{position:absolute;width:2px;height:2px;border-radius:50%;background:#8ffff9;box-shadow:0 0 8px #41faf1;opacity:0;animation:dust 5s ease-in-out infinite}
@keyframes ambient{to{transform:scale(1.18);opacity:.65}}
@keyframes scan{to{transform:translateY(1280px)}}
@keyframes dust{0%,100%{opacity:0;transform:translateY(20px)}35%,70%{opacity:.55}}
</style></head>
<body><main id="scene">
<div class="ambient a"></div><div class="ambient b"></div><div class="grid"></div><div class="scan"></div>
<div class="code left"><span>const</span> octoopus = {<br>  <i>brand</i>: <b>"creative"</b>,<br>  color: <b>"#41faf1"</b>,<br>  mode: <b>"build"</b>,<br>  motion: <b>true</b><br>};<br><br><span>function</span> create(){<br>  return ideas.map(<br>    idea =&gt; build(idea)<br>  );<br>}</div>
<div class="code right"><span>class</span> Studio {<br>  constructor(){<br>    this.focus = <b>"quality"</b>;<br>    this.stack = [<br>      <i>"design"</i>,<br>      <i>"code"</i>,<br>      <i>"motion"</i><br>    ];<br>  }<br>}<br><br><span>await</span> render();</div>
<div class="panel p1"></div><div class="panel p2"></div><div class="panel p3"></div>
<div class="sign">
<svg viewBox="0 0 650 210" role="img" aria-label="octoopus neon sign">
<defs>
 <filter id="neon" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="3" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b2"/><feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="wideGlow" x="-80%" y="-150%" width="260%" height="400%"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="sparkGlow"><feGaussianBlur stdDeviation="4" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect class="signFrameGlow" x="30" y="38" width="590" height="128" rx="30"/>
<rect class="signFrame" x="30" y="38" width="590" height="128" rx="30"/>
<text class="tubeBase" x="325" y="128">octoopus</text>
<text class="tube" x="325" y="128">octoopus</text>
<text class="spark" x="325" y="128">octoopus</text>
</svg></div>
<div class="dust" style="left:28%;top:28%;animation-delay:.2s"></div><div class="dust" style="left:73%;top:34%;animation-delay:1.8s"></div><div class="dust" style="left:82%;top:73%;animation-delay:2.6s"></div><div class="dust" style="left:18%;top:80%;animation-delay:3.3s"></div>
</main>
<script>
const spark=document.querySelector('.spark'),tube=document.querySelector('.tube'),base=document.querySelector('.tubeBase'),a=document.querySelector('.ambient.a');
window.renderAt=function(t){
 const flicker=(t>1.15&&t<1.34)||(t>3.72&&t<3.82);
 const pulse=.88+.12*(.5+.5*Math.sin(t*2.1));
 const power=flicker?.32:pulse;
 tube.style.opacity=String(power);base.style.opacity=String(.18+.08*pulse);
 spark.style.opacity=(t%2.7<.42)?String(.95*(1-(t%2.7)/.42)):"0";
 spark.style.strokeDashoffset=String(-((t%2.7)/.42)*560);
 a.style.opacity=String(.55+.2*Math.sin(t*1.1));
 document.querySelector('.scan').style.transform='translateY('+((t*182)%1280)+'px)';
};
</script></body></html>
