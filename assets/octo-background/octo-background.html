<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octoopus Neon Studio Background</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071326}
#scene{position:relative;width:720px;height:1280px;overflow:hidden;isolation:isolate;background:
 radial-gradient(ellipse 82% 40% at 50% 8%,#16465a 0%,#10334b 32%,transparent 76%),
 radial-gradient(ellipse 75% 62% at 50% 58%,#0b3046 0%,#0a2239 52%,transparent 100%),
 linear-gradient(160deg,#07172c 0%,#0a2037 48%,#061326 100%)}
#scene:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 35%,#020a17a8 100%);pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(85px);pointer-events:none;mix-blend-mode:screen}
.glow.one{width:560px;height:360px;left:80px;top:-90px;background:#35f5e32a;animation:breathe 7s ease-in-out infinite alternate}
.glow.two{width:460px;height:520px;left:120px;top:460px;background:#087eaa1b;animation:breathe 9s ease-in-out infinite alternate-reverse}
.glow.three{width:360px;height:260px;left:180px;bottom:-90px;background:#20d9d022;animation:breathe 8s ease-in-out infinite alternate}
.sign{position:absolute;top:54px;left:0;width:100%;height:250px;display:flex;align-items:center;justify-content:center}
.sign svg{width:690px;height:240px;overflow:visible}
.mount{fill:url(#mount);stroke:#4ceee22c;stroke-width:1.4}
.mountEdge{fill:none;stroke:#8ffff52b;stroke-width:1}
.screw{fill:#173e50;stroke:#72f7e94a;stroke-width:1}
.neonBack{font-family:"Segoe Print","Comic Sans MS","Brush Script MT",cursive;font-style:italic;font-weight:700;font-size:104px;letter-spacing:-5px;text-anchor:middle;fill:#063c43;stroke:#063c43;stroke-width:12;stroke-linejoin:round}
.neonTube{font-family:"Segoe Print","Comic Sans MS","Brush Script MT",cursive;font-style:italic;font-weight:700;font-size:104px;letter-spacing:-5px;text-anchor:middle;fill:url(#tubeFill);stroke:#8bfff5;stroke-width:3.8;paint-order:stroke fill;stroke-linejoin:round;filter:url(#tubeGlow)}
.neonCore{font-family:"Segoe Print","Comic Sans MS","Brush Script MT",cursive;font-style:italic;font-weight:700;font-size:104px;letter-spacing:-5px;text-anchor:middle;fill:none;stroke:#f1fffd;stroke-width:1.35;opacity:.88;stroke-linecap:round;filter:url(#coreGlow)}
.glint{fill:none;stroke:#eaffff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:20 900;opacity:0;filter:url(#coreGlow)}
.dust{position:absolute;width:2px;height:2px;border-radius:50%;background:#a4fff8;box-shadow:0 0 9px #41faf1;opacity:0;animation:float 6s ease-in-out infinite}
@keyframes breathe{to{transform:scale(1.18);opacity:.65}}
@keyframes float{0%,100%{opacity:0;transform:translateY(18px)}35%,70%{opacity:.5}}
</style></head>
<body><main id="scene">
<div class="glow one"></div><div class="glow two"></div><div class="glow three"></div>
<div class="sign"><svg viewBox="0 0 690 240" aria-label="octoopus neon sign">
<defs>
 <linearGradient id="mount" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#102f43" stop-opacity=".95"/><stop offset=".5" stop-color="#0b2439" stop-opacity=".92"/><stop offset="1" stop-color="#071a2d" stop-opacity=".98"/></linearGradient>
 <linearGradient id="tubeFill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f1fffd"/><stop offset=".24" stop-color="#cafffa"/><stop offset=".58" stop-color="#69fff0"/><stop offset="1" stop-color="#27d9d1"/></linearGradient>
 <filter id="tubeGlow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3" result="a"/><feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="a"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="coreGlow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect class="mount" x="27" y="42" width="636" height="150" rx="34"/>
<rect class="mountEdge" x="34" y="49" width="622" height="136" rx="29"/>
<circle class="screw" cx="53" cy="67" r="4"/><circle class="screw" cx="637" cy="67" r="4"/>
<circle class="screw" cx="53" cy="167" r="4"/><circle class="screw" cx="637" cy="167" r="4"/>
<text class="neonBack" x="345" y="145">octoopus</text>
<text class="neonTube" x="345" y="145">octoopus</text>
<text class="neonCore" x="345" y="145">octoopus</text>
<path class="glint" d="M95 106 Q240 45 390 92 T605 104"/>
</svg></div>
<div class="dust" style="left:17%;top:31%;animation-delay:.3s"></div><div class="dust" style="left:78%;top:38%;animation-delay:1.7s"></div><div class="dust" style="left:84%;top:71%;animation-delay:2.8s"></div><div class="dust" style="left:21%;top:82%;animation-delay:3.6s"></div><div class="dust" style="left:53%;top:43%;animation-delay:4.2s"></div>
</main>
<script>
const tube=document.querySelector('.neonTube'),core=document.querySelector('.neonCore'),glint=document.querySelector('.glint');
window.renderAt=function(t){
 const flicker=(t>1.08&&t<1.19)||(t>3.64&&t<3.73);
 const pulse=.91+.09*(.5+.5*Math.sin(t*2.0));
 const power=flicker?.62:pulse;
 tube.style.opacity=String(power);core.style.opacity=String(.72+.22*pulse);
 const phase=t%3.1;
 glint.style.opacity=phase<.48?String(.8*(1-phase/.48)):"0";
 glint.style.strokeDashoffset=String(-phase*220);
};
</script></body></html>
