<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octoopus Living Gradient Background</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061326}
#scene{position:relative;width:720px;height:1280px;overflow:hidden;isolation:isolate;background:
 radial-gradient(ellipse 105% 50% at 50% 0%,#16465d 0%,#10334c 34%,transparent 76%),
 radial-gradient(ellipse 78% 56% at 0% 44%,#0c5260 0%,#0a354b 42%,transparent 80%),
 radial-gradient(ellipse 86% 58% at 100% 72%,#0a4568 0%,#0a2944 48%,transparent 82%),
 radial-gradient(ellipse 72% 42% at 48% 104%,#12535d 0%,transparent 78%),
 linear-gradient(145deg,#08182f 0%,#0b223c 48%,#061326 100%)}
#scene:before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 30%,#020a18a0 100%)}
#scene:after{content:"";position:absolute;inset:-10%;pointer-events:none;background:linear-gradient(112deg,transparent 24%,#54fff00b 43%,#42e8ff12 50%,transparent 68%);mix-blend-mode:screen}
.colorfield{position:absolute;inset:-18%;border-radius:50%;filter:blur(58px);mix-blend-mode:screen;pointer-events:none;will-change:transform,opacity}
.colorfield.a{background:radial-gradient(ellipse at 40% 42%,#28f5df70 0%,#10b9d34a 32%,#087f9b20 52%,transparent 72%);transform:translate(-7%,-4%) scale(1.04)}
.colorfield.b{background:radial-gradient(ellipse at 66% 60%,#18a9ed68 0%,#0d82c14a 34%,#0b506c28 54%,transparent 74%);transform:translate(6%,5%) scale(1.08)}
.lightwash{position:absolute;inset:-25%;z-index:1;pointer-events:none;mix-blend-mode:screen;filter:blur(34px);will-change:transform,opacity;background:radial-gradient(ellipse 25% 13% at 50% 50%,#70fff06b 0%,#24dce044 42%,transparent 76%)}
.colorfield.c{background:radial-gradient(ellipse at 48% 28%,#69ffe65c 0%,#22c9d846 28%,#13a6b528 48%,transparent 70%);transform:translate(0,-4%) scale(.98)}
.sign{position:absolute;top:54px;left:0;width:100%;height:190px;display:flex;align-items:center;justify-content:center;z-index:2}
.sign svg{width:621px;height:190px;overflow:visible}
.wordmark{font-family:"Segoe UI Light","Aptos Light","Helvetica Neue",Arial,sans-serif;font-size:18px;font-weight:500;letter-spacing:.2px;text-anchor:middle;fill:url(#wordColor);filter:url(#tinyWave)}
</style></head>
<body><main id="scene">
<div class="colorfield a"></div><div class="colorfield b"></div><div class="colorfield c"></div><div class="lightwash"></div>
<div class="sign"><svg viewBox="0 0 621 190" aria-label="octoopus">
<defs>
 <linearGradient id="wordColor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4fff4"/><stop offset=".48" stop-color="#54f4e8"/><stop offset="1" stop-color="#39cbdc"/></linearGradient>
 <filter id="tinyWave" x="-8%" y="-20%" width="116%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency=".012 .035" numOctaves="1" seed="7" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
</defs>
<text class="wordmark" x="310.5" y="119" textLength="72" lengthAdjust="spacingAndGlyphs">octoopus</text>
</svg></div>
</main>
<script>
const fields=[...document.querySelectorAll('.colorfield')];
const wave=document.querySelector('#tinyWave feTurbulence');
const wash=document.querySelector('.lightwash');
window.renderAt=function(t){
 fields[0].style.transform='translate('+(-7+Math.sin(t*.19)*3)+'%,'+(-4+Math.cos(t*.16)*3)+'%) scale(1.04)';
 fields[1].style.transform='translate('+(6+Math.cos(t*.15)*4)+'%,'+(5+Math.sin(t*.18)*3)+'%) scale(1.08)';
 fields[2].style.transform='translate('+Math.sin(t*.13)*2+'%,'+(-4+Math.cos(t*.17)*3)+'%) scale(.98)';
 fields[0].style.opacity=String(.94+.06*Math.sin(t*.42));
 fields[1].style.opacity=String(.90+.08*Math.sin(t*.34+1.4));
 fields[2].style.opacity=String(.88+.08*Math.sin(t*.29+2.1));
 wash.style.transform='translate('+Math.sin(t*.32)*31+'%,'+Math.cos(t*.23)*23+'%) rotate('+Math.sin(t*.16)*18+'deg) scale('+(1+.12*Math.sin(t*.27))+')';
 wash.style.opacity=String(.62+.28*Math.sin(t*.38+1));
 wave.setAttribute('baseFrequency','.012 .035');
 wave.setAttribute('seed','7');
};
</script></body></html>
