<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Octoopus Living Gradient Background</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061326}
#scene{position:relative;width:720px;height:1280px;overflow:hidden;isolation:isolate;background:
 radial-gradient(ellipse 110% 48% at 48% 4%,#16485c 0%,#10364d 28%,transparent 74%),
 radial-gradient(ellipse 76% 52% at 4% 46%,#0b5360 0%,#0a354b 38%,transparent 78%),
 radial-gradient(ellipse 82% 55% at 100% 72%,#073e60 0%,#0a2944 45%,transparent 80%),
 radial-gradient(ellipse 68% 38% at 48% 104%,#10505a 0%,transparent 76%),
 linear-gradient(145deg,#07172d 0%,#0a2038 44%,#061326 100%)}
#scene:before{content:"";position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 30%,#020a18a0 100%)}
#scene:after{content:"";position:absolute;inset:-10%;pointer-events:none;background:linear-gradient(112deg,transparent 24%,#54fff00b 43%,#42e8ff12 50%,transparent 68%);mix-blend-mode:screen}
.colorfield{position:absolute;inset:-18%;border-radius:50%;filter:blur(75px);mix-blend-mode:screen;pointer-events:none;will-change:transform,opacity}
.colorfield.a{background:radial-gradient(ellipse at 40% 42%,#1ce4d32d 0%,#087f9b19 34%,transparent 68%);transform:translate(-7%,-4%) scale(1.04)}
.colorfield.b{background:radial-gradient(ellipse at 66% 60%,#0c82c13a 0%,#0b506c20 38%,transparent 70%);transform:translate(6%,5%) scale(1.08)}
.colorfield.c{background:radial-gradient(ellipse at 48% 28%,#55f8df19 0%,#13a6b51a 30%,transparent 65%);transform:translate(0,-4%) scale(.98)}
.sign{position:absolute;top:54px;left:0;width:100%;height:190px;display:flex;align-items:center;justify-content:center;z-index:2}
.sign svg{width:621px;height:190px;overflow:visible}
.wordmark{font-family:"Segoe UI Light","Aptos Light","Helvetica Neue",Arial,sans-serif;font-size:88px;font-weight:300;letter-spacing:1.1px;text-anchor:middle;fill:url(#wordColor);filter:url(#tinyWave)}
</style></head>
<body><main id="scene">
<div class="colorfield a"></div><div class="colorfield b"></div><div class="colorfield c"></div>
<div class="sign"><svg viewBox="0 0 621 190" aria-label="octoopus">
<defs>
 <linearGradient id="wordColor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a4fff4"/><stop offset=".48" stop-color="#54f4e8"/><stop offset="1" stop-color="#39cbdc"/></linearGradient>
 <filter id="tinyWave" x="-8%" y="-20%" width="116%" height="140%">
  <feTurbulence type="fractalNoise" baseFrequency=".012 .035" numOctaves="1" seed="7" result="noise"/>
  <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.15" xChannelSelector="R" yChannelSelector="G"/>
 </filter>
</defs>
<text class="wordmark" x="310.5" y="119">octoopus</text>
</svg></div>
</main>
<script>
const fields=[...document.querySelectorAll('.colorfield')];
const wave=document.querySelector('#tinyWave feTurbulence');
window.renderAt=function(t){
 // Slow, overlapping light drift: a living underwater glow, not a moving graphic.
 fields[0].style.transform='translate('+(-7+Math.sin(t*.19)*3)+'%,'+(-4+Math.cos(t*.16)*3)+'%) scale(1.04)';
 fields[1].style.transform='translate('+(6+Math.cos(t*.15)*4)+'%,'+(5+Math.sin(t*.18)*3)+'%) scale(1.08)';
 fields[2].style.transform='translate('+Math.sin(t*.13)*2+'%,'+(-4+Math.cos(t*.17)*3)+'%) scale(.98)';
 fields[0].style.opacity=String(.82+.12*Math.sin(t*.42));
 fields[1].style.opacity=String(.78+.14*Math.sin(t*.34+1.4));
 fields[2].style.opacity=String(.75+.12*Math.sin(t*.29+2.1));
 // An almost imperceptible ripple passes through the lettering.
 wave.setAttribute('baseFrequency',String(.012+.001*Math.sin(t*.8))+' .035');
 wave.setAttribute('seed',String(7+Math.floor((t%4)*2)));
};
</script></body></html>
